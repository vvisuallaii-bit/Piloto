# claude-proxy — Cloudflare Worker
# Proxy hacia la API de Claude + API de tareas (Fase 2, Cloudflare D1).
#
# Secrets esperados (NO van en este archivo — se configuran con `wrangler secret put`):
#   ANTHROPIC_API_KEY  → usado por la ruta proxy existente (POST /)
#   ADMIN_KEY          → protege POST /tareas (creación manual de tareas)
#
# IMPORTANTE antes del primer deploy: si el Worker desplegado hoy usa otro nombre
# de variable para la API key de Anthropic, ajusta env.ANTHROPIC_API_KEY en
# src/index.js para que coincida (los secrets ya configurados en Cloudflare se
# conservan entre deploys de wrangler).

name = "claude-proxy"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Cron: genera las tareas de la semana automáticamente (Paso 2).
# "0 12 * * 1" = lunes 12:00 UTC = lunes 7:00am Bogotá (UTC-5).
# El handler scheduled() en src/index.js itera sobre las clínicas activas.
# Disparo manual para probar: POST /tareas/generar (con X-Admin-Key).
[triggers]
crons = ["0 12 * * 1"]

# Observabilidad (logs en el dashboard de Cloudflare). Se restaura aquí porque
# venía activa en el Worker original y un deploy sin este bloque la apagaba.
[observability]
enabled = true

# Binding de Workers AI que traía el Worker original. El proxy no lo usa (llama
# a la API de Anthropic por fetch directo), pero se conserva para no alterar la
# configuración previa del Worker.
[ai]
binding = "AI"

# Binding D1 para el sistema de tareas (Fase 2).
# 1. Crea la base:            npx wrangler d1 create smile-dental-tareas
# 2. Copia el database_id que devuelve el comando y reemplázalo abajo.
[[d1_databases]]
binding = "DB"
database_name = "smile-dental-tareas"
database_id = "b7a26615-686d-4d0b-ac44-8d7971fe2fc8"
migrations_dir = "migrations"
